<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    
    <title>Cadastro</title>
</head>
<body>
    <main class="container">
        <form method="POST">
            <h1>Cadastro</h1>
            <div class="input-box">
                <input placeholder="Nome" type="text" name="first_name" required>
                <span class="material-symbols-outlined">person</span>
            </div>
            <div class="input-box">
                <input placeholder="Sobrenome" type="text" name="last_name" required>
                <span class="material-symbols-outlined">person</span>
            </div>
            <div class="input-box">
                <input placeholder="E-mail" type="email" name="email" required>
                <span class="material-symbols-outlined">mail</span>
            </div>
            <div class="input-box">
                <input id="senha" placeholder="Senha" type="password"  name="password" required>
                <span id="toggleSenha" class="material-symbols-outlined">lock</span>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Lembrar senha
                </label>
                <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit" class="button-submit">Cadastrar</button>

            <div class="link">
                <p>Já possui uma conta? Faça <a href="{{ url_for('home') }}">Login</a></p>
            </div>
        </form>
    </main>
    
    <script src="../static/js/script.js"></script>
</body>
</html>
